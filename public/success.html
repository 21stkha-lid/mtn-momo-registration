<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful - MTN MoMo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FFCC00 0%, #FFB300 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        .container {
            background: white; border-radius: 20px;
            padding: 50px 30px; max-width: 420px; width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .success-icon {
            width: 90px; height: 90px; background: #28a745;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            margin: 0 auto 25px; font-size: 50px; color: white;
        }
        h1 { color: #28a745; margin-bottom: 10px; font-size: 1.6em; }
        p { color: #666; margin-bottom: 10px; line-height: 1.6; }
        .details {
            background: #f8f9fa; border-radius: 12px;
            padding: 20px; margin: 25px 0; text-align: left;
        }
        .detail-row {
            display: flex; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid #e9ecef;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #666; font-weight: 500; }
        .detail-value { color: #333; font-weight: 600; }
        .status-badge {
            display: inline-block; padding: 10px 25px;
            border-radius: 25px; font-size: 14px; font-weight: bold;
            background: #fff3cd; color: #856404; margin-top: 15px;
        }
        .btn {
            width: 100%; padding: 16px; border: none;
            border-radius: 10px; font-size: 16px; font-weight: bold;
            cursor: pointer; color: #000; background: #FFCC00;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Registration Successful!</h1>
        <p>Your MTN MoMo registration has been received.</p>

        <div class="details">
            <div class="detail-row">
                <span class="detail-label">Registration ID</span>
                <span class="detail-value" id="regId">#----</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">MTN Number</span>
                <span class="detail-value" id="regNumber">---</span>
            </div>
        </div>

        <div class="status-badge">Pending Verification</div>

        <p style="margin-top: 20px; font-size: 13px; color: #999;">
            You will receive a confirmation SMS shortly.
        </p>

        <button class="btn" onclick="window.location.href='/'">
            Register Another Account
        </button>
    </div>

    <script>
        document.getElementById('regId').textContent = '#' + (localStorage.getItem('registrationId') || '----');
        document.getElementById('regNumber').textContent = localStorage.getItem('mtnNumber') || '---';
    </script>
</body>
</html>
